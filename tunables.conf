# What a run may spend, and which solver it asks first.
#
# Read by cli/tunables.h, once, at the start of a run: from the file named by
# $BILINEAR_TUNABLES if that is set, else from tunables.conf in the working
# directory, else not at all. Every value below is also the default compiled in,
# so deleting this file changes nothing and every published number stands.
#
# `name = value`, one per line. `#` starts a comment. A name that is not one of
# these is refused rather than ignored, so a typo stops the run instead of
# quietly leaving the old number in force.

# Nodes an exhaustive search may visit before it gives up. Reaching it proves
# nothing in either direction, which is why every decide-rank line reports it.
search_node_limit = 5000000

# Elements one leaf may examine before that leaf is abandoned. The node limit
# bounds how many leaves are reached and nothing inside one, and at <4,4,4> a
# single leaf is a 4.3e9-map scan measured at 785 ns each, so 0.9 hours that no
# --node-limit could interrupt. PROVISIONAL: 383x the largest leaf any published
# run here reaches, so it moves no measurement, and nothing has tuned it since.
search_leaf_limit = 100000000

# Nodes the built-in branch and bound may open, for the integer programme route
# and for the interpolation bounds.
ilp_node_limit = 200000

# Distinct subspaces one plateau crossing may visit. PROVISIONAL: this number
# has never been measured. Until it moved here no flag could reach it, so no run
# had ever tried another value; minimise-rank --plateau-states now can.
plateau_state_budget = 200000

# What one SAT question may cost before the solver is killed. The memory cap
# matters as much as the clock: this machine has 16 GB and long searches share it.
sat_memory_megabytes = 2048
sat_timeout_seconds = 300

# What one integer programme may cost an outside solver. It bounds the wait; the
# process group is killed at the deadline, so nothing of ours outlives the call.
ilp_time_limit_seconds = 300

# Which SAT solver is asked first, of those on PATH. kissat leads because it is
# the strongest on unsatisfiable instances, and that is where a lower bound is.
sat_solver_order = kissat cryptominisat cadical

# Which integer programme backend is asked first, of those on PATH. The built-in
# trails because it is the slowest, and it is also the only one whose
# "infeasible" is believed without being checked against the model.
ilp_backend_order = gurobi cbc glpk lp_solve built-in

# Which processor answers a bulk question first, of those this build can reach.
# Every question routed here is the same shape: millions of independent elements,
# each formed from its own index and reduced against a basis held in common, which
# is what a card is for. Measured: one whole <4,4,4> leaf, 4 294 836 225 rank-one
# maps, in 1.019 s against 9.2 minutes on one core.
#
# A build with nvcc has the GF(2) leaf kernels behind `gpu`; a build without one
# has nothing, and every question resolves to the host. Either way `decide-rank`
# prints which, and on which of the four conditions the card was refused.
# `--device cpu|gpu|auto` settles it per run; this is where the rule starts.
device_order = gpu cpu

# Elements below which a bulk question stays on the host whatever the order says,
# because a launch costs more than the work. Measured 2026-08-21 by
# `measure-leaf floor` on this machine: the smallest count at which every route
# on every compiled shape beat one core, timed against the card's wall clock and
# not its kernel clock. The walks cross at 4 096 except 5x5's at 8 192, the 9x9
# scan at 8 176, and the 16x16 scan is already 5.6x at 65 535, which is the
# fewest elements one row of that grid can be. run_limits/device.cpp has the
# table.
device_launch_floor = 8192
